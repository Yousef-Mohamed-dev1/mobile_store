name: Build and Release EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller psycopg2-binary bcrypt pillow
        if (Test-Path requirements.txt) { pip import -r requirements.txt }

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --add-data "logo.png;." --add-data "config.json;." --collect-all psycopg2 --collect-all bcrypt --collect-all PIL app_gui.py

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.exe
        tag_name: automated-build
        name: "Latest Automated Build"
        body: "تم تحديث ملف الـ EXE تلقائياً بناءً على آخر تعديل تم رفعه للمستودع (شامل واجهة المستخدم وقاعدة البيانات والفاتورة)."
        overwrite: true